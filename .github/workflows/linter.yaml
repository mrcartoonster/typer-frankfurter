name: Ruff Linting

on: push
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.10"
          # enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v5

      - name: Install
        run: uv sync --locked --all-extras --dev

      - name: Ruff Linting
        run: ruff check typer_frankfurter/

      # - name: Ruff Linting
      #   uses: astral-sh/ruff-action@v3
